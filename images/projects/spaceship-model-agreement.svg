<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="title desc">
  <title id="title">CatBoost and ensemble prediction agreement</title><desc id="desc">The models agree on 8,531 of 8,693 passengers and disagree on 162.</desc>
  <rect width="900" height="460" rx="16" fill="#111"/><text x="48" y="54" fill="#fafafa" font-family="system-ui,sans-serif" font-size="25" font-weight="700">The finalists mostly make the same decisions</text><text x="48" y="84" fill="#a3a3a3" font-family="system-ui,sans-serif" font-size="15">Out-of-fold predictions across all 8,693 training rows</text>
  <circle cx="370" cy="241" r="132" fill="#2563eb" fill-opacity=".62" stroke="#60a5fa" stroke-width="2"/><circle cx="530" cy="241" r="132" fill="#525252" fill-opacity=".72" stroke="#a3a3a3" stroke-width="2"/>
  <g font-family="system-ui,sans-serif" text-anchor="middle"><text x="310" y="164" fill="#fafafa" font-size="16" font-weight="700">CatBoost</text><text x="590" y="164" fill="#fafafa" font-size="16" font-weight="700">4:1 ensemble</text><text x="450" y="226" fill="#fff" font-size="38" font-weight="800">98.1%</text><text x="450" y="254" fill="#e5e5e5" font-size="15">8,531 predictions agree</text><text x="289" y="285" fill="#fff" font-size="24" font-weight="700">74</text><text x="289" y="308" fill="#d4d4d4" font-size="13">CatBoost only correct</text><text x="611" y="285" fill="#fff" font-size="24" font-weight="700">88</text><text x="611" y="308" fill="#d4d4d4" font-size="13">ensemble only correct</text></g>
  <text x="450" y="414" fill="#a3a3a3" font-family="system-ui,sans-serif" font-size="15" text-anchor="middle">The ensemble's net advantage is 14 passengers—not a new performance tier.</text>
</svg>
