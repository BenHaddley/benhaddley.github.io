<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">CryoSleep transport rate comparison</title><desc id="desc">81.8 percent of CryoSleep passengers were transported versus 32.9 percent of awake passengers.</desc>
  <rect width="900" height="430" rx="16" fill="#111"/><text x="48" y="54" fill="#fafafa" font-family="system-ui,sans-serif" font-size="25" font-weight="700">CryoSleep was the strongest single signal</text><text x="48" y="84" fill="#a3a3a3" font-family="system-ui,sans-serif" font-size="15">Transported rate across 8,693 training passengers</text>
  <text x="48" y="160" fill="#e5e5e5" font-family="system-ui,sans-serif" font-size="18" font-weight="600">CryoSleep = True</text><rect x="235" y="132" width="570" height="42" rx="6" fill="#262626"/><rect x="235" y="132" width="466" height="42" rx="6" fill="#3b82f6"/><text x="717" y="160" fill="#fafafa" font-family="system-ui,sans-serif" font-size="22" font-weight="700">81.8%</text>
  <text x="48" y="239" fill="#e5e5e5" font-family="system-ui,sans-serif" font-size="18" font-weight="600">CryoSleep = False</text><rect x="235" y="211" width="570" height="42" rx="6" fill="#262626"/><rect x="235" y="211" width="188" height="42" rx="6" fill="#737373"/><text x="439" y="239" fill="#fafafa" font-family="system-ui,sans-serif" font-size="22" font-weight="700">32.9%</text>
  <rect x="48" y="307" width="804" height="76" rx="8" fill="#171717" stroke="#333"/><circle cx="80" cy="345" r="6" fill="#3b82f6"/><text x="101" y="339" fill="#fafafa" font-family="system-ui,sans-serif" font-size="16" font-weight="600">Hard data rule</text><text x="101" y="363" fill="#a3a3a3" font-family="system-ui,sans-serif" font-size="15">0 of 3,037 CryoSleep passengers had non-zero amenity spending.</text>
</svg>
